# Exports the live state of every CI and Release run (Grafana Cloud Metrics)
# and, when each run completes, its OpenTelemetry traces (Honeycomb, Grafana
# Cloud Traces) and run metrics, through the shared ci-telemetry workflow in
# ulisseas/.github.
# Add other workflow display names to the list as the project grows.
#
# This repo lives in the ulisseas org, so `secrets: inherit` passes the org
# secrets HONEYCOMB_INGEST_KEY and GRAFANA_OTLP_TOKEN through; the GRAFANA_OTLP_*
# and HONEYCOMB_DATASET variables resolve from the org as well. Nothing to set
# up per repo.
name: telemetry

on:
  workflow_run:
    workflows: [CI, Release]
    # requested and in_progress push the live state (ci_workflow_status) for
    # the CI status dashboard; completed also exports traces and run metrics.
    types: [requested, in_progress, completed]

permissions: {}

concurrency:
  group: telemetry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  export:
    uses: ulisseas/.github/.github/workflows/ci-telemetry.yml@8df148ad4c885fae1af1fcfc4b1c790f11a39f12 # v1.1.0
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    with:
      run_id: ${{ github.event.workflow_run.id }}
    secrets: inherit
