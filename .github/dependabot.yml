# Dependabot: keeps GitHub Actions and the npm tooling (semantic-release,
# commitlint, husky) current. Minor/patch updates are grouped into one PR per
# ecosystem to cut noise; majors arrive as separate PRs.
#
# commit-message pins the conventional prefix to "chore(deps): ..." /
# "chore(deps-dev): ..." instead of letting Dependabot guess it from recent
# commits; commitlint.config.cjs exempts exactly that shape. The case of the
# word after the prefix ("Bump" / "bump") is not configurable: Dependabot
# mirrors its own last commit on main, or, before one exists, the case it
# reads from recent commits. That is why the exemption accepts both.
#
# The labels below must exist in the repository or Dependabot silently drops
# them (and a custom labels: list also replaces the default "dependencies"
# label); scripts/harden-repo.sh step 6 creates them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Vancouver
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, github-actions]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Vancouver
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, npm]
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    ignore:
      # conventional-changelog-conventionalcommits 10.x needs
      # conventional-changelog-writer 9, but @semantic-release/release-notes-
      # generator still bundles writer 8; the Release workflow then fails at
      # the notes step. Drop this once the notes generator moves to writer 9.
      - dependency-name: conventional-changelog-conventionalcommits
        versions: [">=10"]
